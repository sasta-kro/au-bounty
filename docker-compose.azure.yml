name: au-bounty

# VM deployment: runs the prebuilt GHCR images (linux/amd64) instead of
# building from source. Sits behind the host nginx gateway, which forwards
# /aubounty/ to the frontend service on 127.0.0.1:8090. Everything except the
# frontend stays on the internal compose network; the loopback binds exist for
# SSH-tunnel debugging only. Secrets live in the env file next to this one
# (see .env.azure notes in the repo docs) and are never committed.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aubounty
      POSTGRES_PASSWORD: aubounty
      POSTGRES_DB: aubounty
    volumes:
      - aubounty-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aubounty -d aubounty"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    # MinIO left Docker Hub in 2025; quay.io is the maintained registry.
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aubounty
      MINIO_ROOT_PASSWORD: aubounty
    volumes:
      - aubounty-miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 aubounty aubounty &&
      (mc mb -p local/aubounty || true)
      "
    restart: "no"

  api:
    # :main moves with every green CI build; pin a :sha-... tag for demo days.
    image: ghcr.io/sasta-kro/au-bounty-backend:main
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aubounty:aubounty@postgres:5432/aubounty?schema=public
      PORT: "4000"
      CORS_ORIGIN: https://sai-aike-shwe-tun-aung-backend2.indonesiacentral.cloudapp.azure.com
      DEV_AUTH: ${DEV_AUTH:-0}
      # Secrets provider: with SECRETS_PROVIDER=keyvault the five secret values
      # are fetched from Azure Key Vault at boot (see backend src/lib/secrets.js)
      # and override whatever the environment holds, so these passthroughs stay
      # empty on the VM.
      SECRETS_PROVIDER: ${SECRETS_PROVIDER:-env}
      KEY_VAULT_URL: ${KEY_VAULT_URL:-}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      AUTH_CALLBACK_BASE: https://sai-aike-shwe-tun-aung-backend2.indonesiacentral.cloudapp.azure.com/aubounty/api
      APP_ORIGIN: https://sai-aike-shwe-tun-aung-backend2.indonesiacentral.cloudapp.azure.com
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: "true"
      # Two proxies in front of the api (gateway nginx + frontend container
      # nginx) so the admin login throttle sees real client addresses.
      TRUST_PROXY: "2"
      # Admin console accounts are seeded on every boot (entrypoint, before the
      # app starts, so before the vault loader runs). The demo default password
      # applies unless ADMIN_SEED_PASSWORD is passed here.
      ADMIN_SEED_EMAILS: ${ADMIN_SEED_EMAILS:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      # 1 for one boot overwrites the password of already-seeded admins,
      # then set it back to 0.
      ADMIN_SEED_RESET_PASSWORD: ${ADMIN_SEED_RESET_PASSWORD:-0}
      SEED_ADMINS: "1"
      # Storage: the defaults are the local MinIO pair on the compose network.
      # The env file switches the stack to Backblaze B2 by overriding these
      # (endpoint = public endpoint = https://s3.<region>.backblazeb2.com).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # Browser-facing origin for presigned upload/download URLs. Empty falls
      # back to S3_ENDPOINT (works only when browsers can reach it directly).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-aubounty}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aubounty}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-aubounty}
      S3_FORCE_PATH_STYLE: "true"
      MAX_UPLOAD_MB: "10"
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY:-}
      GOOGLE_TRANSLATE_KEY: ${GOOGLE_TRANSLATE_KEY:-}
      WEATHER_LAT: "13.6146"
      WEATHER_LON: "100.7121"
      WEATHER_LABEL: Bang Na
      SEED_ON_BOOT: "1"
    restart: unless-stopped

  frontend:
    image: ghcr.io/sasta-kro/au-bounty-frontend:main
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:80"
    restart: unless-stopped

volumes:
  aubounty-pgdata:
  aubounty-miniodata:
