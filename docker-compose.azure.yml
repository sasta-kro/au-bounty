name: au-bounty

# VM deployment: runs the prebuilt GHCR images (linux/amd64) instead of
# building from source. Sits behind the host nginx gateway, which forwards
# /aubounty/ to the frontend service on 127.0.0.1:8090. Everything except the
# frontend stays on the internal compose network; the loopback binds exist for
# SSH-tunnel debugging only. Secrets live in the env file next to this one
# (see .env.azure notes in the repo docs) and are never committed.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aubounty
      POSTGRES_PASSWORD: aubounty
      POSTGRES_DB: aubounty
    volumes:
      - aubounty-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aubounty -d aubounty"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    # MinIO left Docker Hub in 2025; quay.io is the maintained registry.
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aubounty
      MINIO_ROOT_PASSWORD: aubounty
    volumes:
      - aubounty-miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 aubounty aubounty &&
      (mc mb -p local/aubounty || true)
      "
    restart: "no"

  api:
    image: ghcr.io/sasta-kro/au-bounty-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aubounty:aubounty@postgres:5432/aubounty?schema=public
      PORT: "4000"
      CORS_ORIGIN: https://sai-aike-shwe-tun-aung-backend2.indonesiacentral.cloudapp.azure.com
      DEV_AUTH: ${DEV_AUTH:-0}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      AUTH_CALLBACK_BASE: https://sai-aike-shwe-tun-aung-backend2.indonesiacentral.cloudapp.azure.com/aubounty/api
      APP_ORIGIN: https://sai-aike-shwe-tun-aung-backend2.indonesiacentral.cloudapp.azure.com
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the env file}
      COOKIE_SECURE: "true"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: aubounty
      S3_ACCESS_KEY: aubounty
      S3_SECRET_KEY: aubounty
      S3_FORCE_PATH_STYLE: "true"
      MAX_UPLOAD_MB: "10"
      MAIL_TRANSPORT: console
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY:-}
      GOOGLE_TRANSLATE_KEY: ${GOOGLE_TRANSLATE_KEY:-}
      WEATHER_LAT: "13.6146"
      WEATHER_LON: "100.7121"
      WEATHER_LABEL: Bang Na
      PEER_INBOUND_API_KEY: ${PEER_API_KEY:?set PEER_API_KEY in the env file}
      PEER_OUTBOUND_URL: http://peer-mock:7000
      PEER_OUTBOUND_API_KEY: ${PEER_API_KEY:?set PEER_API_KEY in the env file}
      ALERT_COOLDOWN_MIN: "5"
      SECRETS_PROVIDER: env
      SEED_ON_BOOT: "1"
    restart: unless-stopped

  peer-mock:
    image: ghcr.io/sasta-kro/au-bounty-backend:latest
    command: ["node", "peer-mock/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DO_NOT_MIGRATE: "1"
      PORT: "7000"
      MOCK_API_KEY: ${PEER_API_KEY:?set PEER_API_KEY in the env file}
    ports:
      - "127.0.0.1:7090:7000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/sasta-kro/au-bounty-frontend:latest
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:80"
    restart: unless-stopped

volumes:
  aubounty-pgdata:
  aubounty-miniodata:
