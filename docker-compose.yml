name: au-bounty

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aubounty
      POSTGRES_PASSWORD: aubounty
      POSTGRES_DB: aubounty
    volumes:
      - aubounty-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aubounty -d aubounty"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # MinIO left Docker Hub in 2025; quay.io is the maintained registry.
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aubounty
      MINIO_ROOT_PASSWORD: aubounty
    volumes:
      - aubounty-miniodata:/data
    ports:
      - "127.0.0.1:9100:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 aubounty aubounty &&
      (mc mb -p local/aubounty || true)
      "
    restart: "no"

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aubounty:aubounty@postgres:5432/aubounty?schema=public
      PORT: "4000"
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
      DEV_AUTH: ${DEV_AUTH:-1}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      AUTH_CALLBACK_BASE: http://localhost:4000/aubounty/api
      APP_ORIGIN: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      COOKIE_SECURE: "false"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9100
      S3_REGION: us-east-1
      S3_BUCKET: aubounty
      S3_ACCESS_KEY: aubounty
      S3_SECRET_KEY: aubounty
      S3_FORCE_PATH_STYLE: "true"
      MAX_UPLOAD_MB: "10"
      MAIL_TRANSPORT: console
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_MAPS_KEY: ${GOOGLE_MAPS_KEY:-}
      GOOGLE_TRANSLATE_KEY: ${GOOGLE_TRANSLATE_KEY:-}
      WEATHER_LAT: "13.6146"
      WEATHER_LON: "100.7121"
      WEATHER_LABEL: Bang Na
      SECRETS_PROVIDER: env
      SEED_ON_BOOT: "1"
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  aubounty-pgdata:
  aubounty-miniodata:
