name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aubounty
          POSTGRES_PASSWORD: aubounty
          POSTGRES_DB: aubounty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aubounty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://aubounty:aubounty@localhost:5432/aubounty_test
      DATABASE_URL: postgresql://aubounty:aubounty@localhost:5432/aubounty_test
      JWT_SECRET: ci-signing-secret-for-tests-only
      DEV_AUTH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install
        working-directory: backend
        run: npm ci
      - name: generate prisma client
        working-directory: backend
        run: npx prisma generate
      - name: test
        working-directory: backend
        run: npm test

  frontend:
    name: frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install
        working-directory: frontend
        run: npm ci
      - name: lint
        working-directory: frontend
        run: npm run lint
      - name: build
        working-directory: frontend
        run: npm run build

  images:
    name: build and push images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Pinned submodule commits, not their remote heads: an image tag must
          # map to one exact compatible frontend + backend pair.
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u sasta-kro --password-stdin
      - name: backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          # :sha-<short> is the immutable per-build tag, :main the moving
          # alias the VM compose tracks. Release numbers are aliases made
          # later with `docker buildx imagetools create`, never rebuilds.
          tags: |
            ghcr.io/sasta-kro/au-bounty-backend:main
            ghcr.io/sasta-kro/au-bounty-backend:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          # The maps browser key bakes in via frontend/.env.production, which
          # vite loads in production mode; no build-arg or secret needed here.
          tags: |
            ghcr.io/sasta-kro/au-bounty-frontend:main
            ghcr.io/sasta-kro/au-bounty-frontend:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
