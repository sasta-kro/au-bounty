name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aubounty
          POSTGRES_PASSWORD: aubounty
          POSTGRES_DB: aubounty_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aubounty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://aubounty:aubounty@localhost:5432/aubounty_test
      DATABASE_URL: postgresql://aubounty:aubounty@localhost:5432/aubounty_test
      JWT_SECRET: ci-signing-secret-for-tests-only
      DEV_AUTH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install
        working-directory: backend
        run: npm ci
      - name: test
        working-directory: backend
        run: npm test

  frontend:
    name: frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install
        working-directory: frontend
        run: npm ci
      - name: lint
        working-directory: frontend
        run: npm run lint
      - name: build
        working-directory: frontend
        run: npm run build
