name: e2e

on:
  workflow_dispatch:

jobs:
  playwright:
    name: e2e journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: install
        run: npm ci

      - name: install chromium
        run: npx playwright install --with-deps chromium

      # The webServer hook boots the whole compose stack (postgres, minio,
      # api, nginx) with --build, then the suite runs against it.
      - name: run
        run: npx playwright test
        env:
          CI: 'true'

      - name: upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          # Artifact paths resolve from the workspace root, not the job's
          # working-directory default.
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
